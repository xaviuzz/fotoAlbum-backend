openapi: 3.0.3
info:
  title: fotoAlbum API
  version: 0.1.0
paths:
  /health.check:
    post:
      operationId: healthCheck
      summary: Tells whether the service is alive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthCheckCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /album.list:
    post:
      operationId: albumList
      summary: Lists every album of the catalogue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumListCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumListReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /album.get:
    post:
      operationId: albumGet
      summary: Answers the album of a reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlbumGetCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumGetReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /userAlbum.create:
    post:
      operationId: userAlbumCreate
      summary: Makes the user album of the session from a catalogue model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAlbumCreateCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAlbumCreateReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /userAlbum.get:
    post:
      operationId: userAlbumGet
      summary: Answers the user album of the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAlbumGetCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAlbumGetReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /photo.list:
    post:
      operationId: photoList
      summary: Lists the photos of the session, oldest first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoListCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoListReply"
        "400":
          description: unreadable JSON or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /photo.upload:
    post:
      operationId: photoUpload
      summary: Stores the photos of the session and makes their thumbnails
      description: The one operation that is not JSON. Rejected files do not stop the others.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadCall"
      responses:
        "200":
          description: ok, or an error carried in the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploadReply"
        "400":
          description: unreadable form or missing callId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportError"
  /photos/{sessionId}/{photoId}/thumbnail:
    get:
      operationId: photoThumbnail
      summary: Serves the thumbnail of a photo
      description: The single exception to the RPC style, because an img element can only GET.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: photoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: the thumbnail, always JPEG
          headers:
            Cache-Control:
              description: public, immutable
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: unknown photo
components:
  schemas:
    CallHeader:
      type: object
      required: [callId]
      properties:
        callId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
    HealthCheckCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    ReplyHeader:
      type: object
      required: [callId, status]
      properties:
        callId:
          type: string
        status:
          type: string
          enum: [ok, error]
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_BODY
            - ALBUM_NOT_FOUND
            - SESSION_REQUIRED
            - USER_ALBUM_ALREADY_EXISTS
            - USER_ALBUM_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
    HealthCheckReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]
            - $ref: "#/components/schemas/ErrorBody"
    Size:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Album:
      type: object
      required: [reference, commercialName, albumSize, pageSize, pageCount, binding, orientation]
      properties:
        reference:
          type: string
        commercialName:
          type: string
        albumSize:
          $ref: "#/components/schemas/Size"
        pageSize:
          $ref: "#/components/schemas/Size"
        pageCount:
          type: integer
          minimum: 2
        binding:
          type: string
          enum: [hardcover, softcover]
        orientation:
          type: string
          enum: [square, portrait, landscape]
    AlbumListCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    AlbumListReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [albums]
              properties:
                albums:
                  type: array
                  items:
                    $ref: "#/components/schemas/Album"
            - $ref: "#/components/schemas/ErrorBody"
    AlbumGetCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              minLength: 1
    AlbumGetReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [album]
              properties:
                album:
                  $ref: "#/components/schemas/Album"
            - $ref: "#/components/schemas/ErrorBody"
    UserAlbum:
      type: object
      required: [id, reference, commercialName, albumSize, pageSize, pageCount, binding, orientation]
      properties:
        id:
          type: string
        reference:
          type: string
        commercialName:
          type: string
        albumSize:
          $ref: "#/components/schemas/Size"
        pageSize:
          $ref: "#/components/schemas/Size"
        pageCount:
          type: integer
          minimum: 2
        binding:
          type: string
          enum: [hardcover, softcover]
        orientation:
          type: string
          enum: [square, portrait, landscape]
    UserAlbumCreateCall:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
          required: [reference]
          properties:
            reference:
              type: string
              minLength: 1
    UserAlbumCreateReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [userAlbum]
              properties:
                userAlbum:
                  $ref: "#/components/schemas/UserAlbum"
            - $ref: "#/components/schemas/ErrorBody"
    UserAlbumGetCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    UserAlbumGetReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [userAlbum]
              properties:
                userAlbum:
                  $ref: "#/components/schemas/UserAlbum"
            - $ref: "#/components/schemas/ErrorBody"
    Photo:
      type: object
      required: [id, thumbnailUrl]
      properties:
        id:
          type: string
        thumbnailUrl:
          type: string
    RejectionCode:
      type: string
      enum: [UNSUPPORTED_FORMAT, TOO_LARGE, UNREADABLE_IMAGE]
    RejectedFile:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          $ref: "#/components/schemas/RejectionCode"
    PhotoListCall:
      type: object
      required: [header]
      properties:
        header:
          $ref: "#/components/schemas/CallHeader"
        body:
          type: object
    PhotoListReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Photo"
            - $ref: "#/components/schemas/ErrorBody"
    PhotoUploadCall:
      type: object
      required: [callId, sessionId, files]
      properties:
        callId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
        files:
          type: array
          items:
            type: string
            format: binary
    PhotoUploadReply:
      type: object
      required: [header, body]
      properties:
        header:
          $ref: "#/components/schemas/ReplyHeader"
        body:
          oneOf:
            - type: object
              required: [photos, rejected]
              properties:
                photos:
                  type: array
                  items:
                    $ref: "#/components/schemas/Photo"
                rejected:
                  type: array
                  items:
                    $ref: "#/components/schemas/RejectedFile"
            - $ref: "#/components/schemas/ErrorBody"
    TransportError:
      $ref: "#/components/schemas/ErrorBody"
